const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(DATA));
  return new TextDecoder().decode(out);
}
function render(html){ document.open(); document.write(html); document.close(); }
async function tryPw(pw, remember){
  const norm = pw.replace(/\s+/g, "").toLowerCase();
  const html = await unlock(norm);
  if (remember){ try{ localStorage.setItem("aarb-pw", norm); }catch(e){} }
  render(html);
}
(async () => {
  let saved = null;
  try{ saved = localStorage.getItem("aarb-pw"); }catch(e){}
  if (saved){ try{ await tryPw(saved, false); return; }catch(e){ try{ localStorage.removeItem("aarb-pw"); }catch(_){} } }
  document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Opening"; err.textContent = "";
  try{ await tryPw(document.getElementById("pw").value, true); }
  catch(_){
    err.textContent = "That password didn\u2019t work. Try again.";
    btn.disabled = false; btn.textContent = "Enter";
  }
});
</script>
